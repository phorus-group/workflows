name: Reusable workflow to build and deploy an Expo app to the app stores via EAS

# Splits the pipeline into four independent status checks so you can see
# exactly which stage failed:
#   build-android  -> submit-android
#   build-ios      -> submit-ios
# Android and iOS run in parallel. Each build job WAITS for EAS to finish,
# so a red check means a real build/submit failure (not just "queued").

on:
  workflow_call:
    inputs:
      profile:
        description: "EAS build/submit profile from eas.json"
        type: string
        required: false
        default: "production"
      environment:
        description: "GitHub Environment name (approval gates / environment secrets)"
        type: string
        required: false
        default: "production"
      node-version:
        description: "Node.js version used to install dependencies"
        type: string
        required: false
        default: "24"
      working-directory:
        description: "Directory containing the Expo app"
        type: string
        required: false
        default: "."
    secrets:
      expo-token:
        description: "Expo access token used to authenticate the EAS CLI (a robot token is recommended)"
        required: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f yarn.lock ]; then
            echo "cache=yarn"                             >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock"                     >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "cache=npm"                              >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json"             >> "$GITHUB_OUTPUT"
            echo "install=npm ci"                         >> "$GITHUB_OUTPUT"
          else
            echo "::error::No yarn.lock or package-lock.json found in ${{ inputs.working-directory }}"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ steps.pm.outputs.install }}

      - name: Build Android
        id: build
        uses: phorus-group/expo-deploy-action@main
        with:
          expo-token: ${{ secrets.expo-token }}
          command: build
          platform: android
          profile: ${{ inputs.profile }}
          working-directory: ${{ inputs.working-directory }}

  submit-android:
    name: Submit Android
    needs: build-android
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f yarn.lock ]; then
            echo "cache=yarn"                             >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock"                     >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "cache=npm"                              >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json"             >> "$GITHUB_OUTPUT"
            echo "install=npm ci"                         >> "$GITHUB_OUTPUT"
          else
            echo "::error::No yarn.lock or package-lock.json found in ${{ inputs.working-directory }}"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}

      # eas submit reads app config, which resolves config plugins
      # (e.g. expo-router) and therefore needs node_modules present.
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ steps.pm.outputs.install }}

      - name: Submit Android
        uses: phorus-group/expo-deploy-action@main
        with:
          expo-token: ${{ secrets.expo-token }}
          command: submit
          platform: android
          profile: ${{ inputs.profile }}
          build-id: ${{ needs.build-android.outputs.build-id }}
          working-directory: ${{ inputs.working-directory }}

  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f yarn.lock ]; then
            echo "cache=yarn"                             >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock"                     >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "cache=npm"                              >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json"             >> "$GITHUB_OUTPUT"
            echo "install=npm ci"                         >> "$GITHUB_OUTPUT"
          else
            echo "::error::No yarn.lock or package-lock.json found in ${{ inputs.working-directory }}"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ steps.pm.outputs.install }}

      - name: Build iOS
        id: build
        uses: phorus-group/expo-deploy-action@main
        with:
          expo-token: ${{ secrets.expo-token }}
          command: build
          platform: ios
          profile: ${{ inputs.profile }}
          working-directory: ${{ inputs.working-directory }}

  submit-ios:
    name: Submit iOS
    needs: build-ios
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f yarn.lock ]; then
            echo "cache=yarn"                             >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock"                     >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "cache=npm"                              >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json"             >> "$GITHUB_OUTPUT"
            echo "install=npm ci"                         >> "$GITHUB_OUTPUT"
          else
            echo "::error::No yarn.lock or package-lock.json found in ${{ inputs.working-directory }}"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.cache }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}

      # eas submit reads app config, which resolves config plugins
      # (e.g. expo-router) and therefore needs node_modules present.
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ steps.pm.outputs.install }}

      - name: Submit iOS
        uses: phorus-group/expo-deploy-action@main
        with:
          expo-token: ${{ secrets.expo-token }}
          command: submit
          platform: ios
          profile: ${{ inputs.profile }}
          build-id: ${{ needs.build-ios.outputs.build-id }}
          working-directory: ${{ inputs.working-directory }}
