name: Reusable workflow example

on:
  workflow_call:
    secrets:
      token:
        required: true

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@v11.17.0
        with:
          projectToken: ${{ secrets.token }}
          onlyChanged: true
          externals: public/**
