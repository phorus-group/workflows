name: Reusable workflow to create a draft release with changelog and Slack notification

on:
  workflow_dispatch:
    inputs:
      versioning:
        description: "Versioning strategy: 'calver' (auto-generated), 'gradle' (from build.gradle), or 'node' (from package.json)"
        type: choice
        options:
          - calver
          - gradle
          - node
        required: true
        default: "calver"
      java-version:
        description: "Java version (gradle only)"
        type: string
        required: false
        default: "21"
      java-distribution:
        description: "Java distribution (gradle only)"
        type: string
        required: false
        default: "temurin"
      target_branch:
        description: "Target branch for the release"
        type: string
        required: false
        default: "main"
      slack_channel:
        description: "Slack channel ID for notification (e.g. C012AB3CD)"
        type: string
        required: false
        default: ""
      max_changelog_entries:
        description: "Maximum number of PRs and commits to include in the changelog"
        type: number
        required: false
        default: 50
  workflow_call:
    inputs:
      versioning:
        description: "Versioning strategy: 'calver' (auto-generated), 'gradle' (from build.gradle), or 'node' (from package.json)"
        type: string
        required: true
        default: "calver"
      java-version:
        description: "Java version (gradle only)"
        type: string
        required: false
        default: "21"
      java-distribution:
        description: "Java distribution (gradle only)"
        type: string
        required: false
        default: "temurin"
      target_branch:
        description: "Target branch for the release"
        type: string
        required: false
        default: "main"
      slack_channel:
        description: "Slack channel ID for notification (e.g. C012AB3CD)"
        type: string
        required: false
        default: ""
      max_changelog_entries:
        description: "Maximum number of PRs and commits to include in the changelog"
        type: number
        required: false
        default: 50
    secrets:
      slack_bot_token:
        description: "Slack Bot User OAuth Token (xoxb-...) for posting messages. Falls back to org/repo-level SLACK_BOT_TOKEN secret."
        required: false
    outputs:
      release_id:
        description: "The ID of the created draft release"
        value: ${{ jobs.draft-release.outputs.release_id }}
      release_url:
        description: "The URL of the created draft release"
        value: ${{ jobs.draft-release.outputs.release_url }}
      tag_name:
        description: "The tag name used for the release"
        value: ${{ jobs.draft-release.outputs.tag_name }}
      version:
        description: "The version extracted from build files (gradle/node only)"
        value: ${{ jobs.extract-version.outputs.version }}

jobs:
  extract-version:
    name: Extract version from build files
    if: ${{ inputs.versioning != 'calver' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Setup Java
        if: ${{ inputs.versioning == 'gradle' }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ inputs.versioning }}" == "gradle" ]]; then
            VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
            NAME=$(./gradlew properties --no-daemon --console=plain -q | grep "^name:" | awk '{print $2}')
          elif [[ "${{ inputs.versioning }}" == "node" ]]; then
            VERSION=$(jq -r .version package.json)
            NAME=$(jq -r .name package.json)
          fi

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "::error::Could not extract version from build files"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION (package: $NAME)"

  draft-release:
    name: Create draft release
    needs: [extract-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      release_url: ${{ steps.create-release.outputs.release_url }}
      tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      contributors: ${{ steps.changelog.outputs.contributors }}
      contributor_emails: ${{ steps.changelog.outputs.contributor_emails }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      - name: Resolve tag name
        id: resolve-tag
        run: |
          if [[ "${{ inputs.versioning }}" == "calver" ]]; then
            # CalVer: v<YYYY>.<MM>.<increment>-<short-sha>
            YEAR=$(date +%Y)
            MONTH=$(date +%-m)
            SHORT_SHA=$(git rev-parse --short HEAD)
            PREFIX="v${YEAR}.${MONTH}."

            # Find the highest existing increment for this year.month
            LATEST_INCREMENT=$(git tag -l "${PREFIX}*" | sed "s|^${PREFIX}||" | sed 's|-.*/||' | sed 's|-.*||' | sort -n | tail -1)

            if [[ -z "$LATEST_INCREMENT" ]]; then
              NEXT_INCREMENT=1
            else
              NEXT_INCREMENT=$((LATEST_INCREMENT + 1))
            fi

            TAG="${PREFIX}${NEXT_INCREMENT}-${SHORT_SHA}"
          else
            # SemVer from build files (gradle/node)
            TAG="v${{ needs.extract-version.outputs.version }}"
          fi

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous tag found, will include all commits on ${{ inputs.target_branch }}"
            echo "range=HEAD" >> $GITHUB_OUTPUT
          else
            echo "Previous tag: $PREV_TAG"
            echo "range=${PREV_TAG}..HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RANGE="${{ steps.prev-tag.outputs.range }}"
          PREV_TAG="${{ steps.prev-tag.outputs.previous_tag }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"

          CHANGELOG=""
          CONTRIBUTORS=""
          CONTRIBUTOR_EMAILS="{}"
          MAX_ENTRIES=${{ inputs.max_changelog_entries }}
          if [[ "$MAX_ENTRIES" -gt 100 ]]; then
            echo "::error::max_changelog_entries cannot exceed 100 (GitHub API per_page limit)"
            exit 1
          fi

          # Determine the date range
          if [[ -n "$PREV_TAG" ]]; then
            SINCE_DATE=$(git log -1 --format=%aI "$PREV_TAG")
          else
            SINCE_DATE=$(git log --reverse --format=%aI | head -1)
          fi
          echo "Range: $RANGE, Previous tag: $PREV_TAG, Since: $SINCE_DATE, Branch: $TARGET_BRANCH, Max entries: $MAX_ENTRIES"

          # Fetch PR metadata keyed by merge commit SHA
          PRS=$(gh pr list \
            --state merged \
            --base "$TARGET_BRANCH" \
            --limit 100 \
            --json number,title,author,mergedAt,url,mergeCommit \
            --jq "[.[] | select(.mergedAt >= \"$SINCE_DATE\")]" 2>/dev/null || echo "[]")
          PR_MAP=$(echo "$PRS" | jq '[.[] | {key: .mergeCommit.oid, value: {num: .number, title: .title, author: .author.login, url: .url}}] | from_entries' 2>/dev/null || echo "{}")
          echo "Found $(echo "$PRS" | jq 'length') PRs in range"

          # Batch fetch commit authors from GitHub API (paginated)
          COMMIT_MAP="{}"
          PAGE=1
          MAX_PAGES=10
          while [[ "$PAGE" -le "$MAX_PAGES" ]]; do
            PAGE_RESULT=$(gh api "repos/${{ github.repository }}/commits?sha=${TARGET_BRANCH}&since=${SINCE_DATE}&per_page=100&page=${PAGE}" \
              --jq '[.[] | {key: .sha, value: (.author.login // "")}] | from_entries' 2>/dev/null || echo "{}")
            PAGE_SIZE=$(echo "$PAGE_RESULT" | jq 'length')
            if [[ "$PAGE_SIZE" -eq 0 ]]; then break; fi
            COMMIT_MAP=$(echo "$COMMIT_MAP" "$PAGE_RESULT" | jq -s 'add')
            echo "Commit map page $PAGE: $PAGE_SIZE commits"
            if [[ "$PAGE_SIZE" -lt 100 ]]; then break; fi
            PAGE=$((PAGE + 1))
          done
          if [[ "$PAGE" -gt "$MAX_PAGES" ]]; then
            echo "::error::Commit map pagination exceeded $MAX_PAGES pages (1000+ commits since last tag). Create a tag at the desired starting point to reduce the range."
            exit 1
          fi
          echo "Commit map total: $(echo "$COMMIT_MAP" | jq 'length') commits"

          # Unified chronological timeline (first-parent = main branch history)
          if [[ "$RANGE" == "HEAD" ]]; then
            TIMELINE=$(git log --first-parent --format="%H|%s|%an|%ae" 2>/dev/null | head -n "$MAX_ENTRIES")
          else
            TIMELINE=$(git log $RANGE --first-parent --format="%H|%s|%an|%ae" 2>/dev/null | head -n "$MAX_ENTRIES")
          fi

          ENTRY_COUNT=0
          while IFS='|' read -r sha subject author email; do
            if [[ -z "$sha" ]]; then continue; fi
            SHORT_SHA=$(echo "$sha" | cut -c1-7)
            COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${sha}"

            PR_ENTRY=$(echo "$PR_MAP" | jq -c --arg sha "$sha" '.[$sha] // empty' 2>/dev/null)

            if [[ -n "$PR_ENTRY" ]]; then
              PR_NUM=$(echo "$PR_ENTRY" | jq -r '.num')
              PR_TITLE=$(echo "$PR_ENTRY" | jq -r '.title')
              PR_AUTHOR=$(echo "$PR_ENTRY" | jq -r '.author')
              PR_URL=$(echo "$PR_ENTRY" | jq -r '.url')
              CHANGELOG+="* PR: ${PR_TITLE} ([#${PR_NUM}](${PR_URL})) by @${PR_AUTHOR}\n"
              CONTRIBUTORS+="${PR_AUTHOR}\n"

              # Only use emails from commits that GitHub attributes to the PR author
              PR_EMAIL=""
              EXISTING_EMAIL=$(echo "$CONTRIBUTOR_EMAILS" | jq -r --arg user "$PR_AUTHOR" '.[$user] // empty')
              if [[ -z "$EXISTING_EMAIL" ]]; then
                while read -r commit_sha commit_email; do
                  if [[ -z "$commit_sha" || "$commit_email" == *"noreply.github.com"* ]]; then continue; fi
                  COMMIT_LOGIN=$(echo "$COMMIT_MAP" | jq -r --arg s "$commit_sha" '.[$s] // empty')
                  if [[ "$COMMIT_LOGIN" == "$PR_AUTHOR" ]]; then
                    PR_EMAIL="$commit_email"
                    break
                  fi
                done <<< "$(git log "${sha}^1..${sha}" --no-merges --format="%H %ae" 2>/dev/null)"
                if [[ -n "$PR_EMAIL" ]]; then
                  CONTRIBUTOR_EMAILS=$(echo "$CONTRIBUTOR_EMAILS" | jq --arg user "$PR_AUTHOR" --arg email "$PR_EMAIL" '. + {($user): $email}')
                fi
              fi
              echo "PR #${PR_NUM}: author=$PR_AUTHOR, email=$PR_EMAIL"
            else
              GH_USER=$(echo "$COMMIT_MAP" | jq -r --arg sha "$sha" '.[$sha] // empty')

              if [[ -n "$GH_USER" ]]; then
                CHANGELOG+="* Commit: ${subject} ([\`${SHORT_SHA}\`](${COMMIT_URL})) by @${GH_USER}\n"
                CONTRIBUTORS+="${GH_USER}\n"
                if [[ -n "$email" && "$email" != *"noreply.github.com"* ]]; then
                  CONTRIBUTOR_EMAILS=$(echo "$CONTRIBUTOR_EMAILS" | jq --arg user "$GH_USER" --arg email "$email" '. + {($user): $email}')
                fi
              else
                CHANGELOG+="* Commit: ${subject} ([\`${SHORT_SHA}\`](${COMMIT_URL})) by ${author}\n"
              fi
              echo "Commit $SHORT_SHA: git_author=$author, git_email=$email, gh_user=$GH_USER"
            fi
            ENTRY_COUNT=$((ENTRY_COUNT + 1))
          done <<< "$TIMELINE"

          # Check if there are more entries than displayed
          if [[ "$RANGE" == "HEAD" ]]; then
            TOTAL_IN_RANGE=$(git rev-list --first-parent --count HEAD 2>/dev/null || echo 0)
          else
            TOTAL_IN_RANGE=$(git rev-list --first-parent --count $RANGE 2>/dev/null || echo 0)
          fi
          if [[ "$ENTRY_COUNT" -lt "$TOTAL_IN_RANGE" ]]; then
            CHANGELOG+="\n> Changelog truncated to ${MAX_ENTRIES} entries. See the full commit history for all changes.\n"
          fi

          # Deduplicate contributors
          UNIQUE_CONTRIBUTORS=$(echo -e "$CONTRIBUTORS" | sort -u | grep -v '^$' | tr '\n' ',' | sed 's/,$//')

          FULL_CHANGELOG="## What Changed\n\n${CHANGELOG}"

          echo "Contributors: $UNIQUE_CONTRIBUTORS"

          echo "contributors=$UNIQUE_CONTRIBUTORS" >> $GITHUB_OUTPUT
          echo "contributor_emails=$(echo "$CONTRIBUTOR_EMAILS" | jq -c .)" >> $GITHUB_OUTPUT

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "changelog<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo -e "$FULL_CHANGELOG" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: Create draft release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag_name }}"

          RESULT=$(gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ inputs.target_branch }}" \
            --draft \
            --notes "$CHANGELOG")

          # gh release create prints the release URL on success
          echo "release_url=$RESULT" >> $GITHUB_OUTPUT

          # Fetch the release ID via API
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft == true)][0].id" 2>/dev/null || echo "")
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

          echo "Draft release created: $RESULT"

      - name: Release summary
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "## Draft Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.versioning }}" != "calver" ]]; then
            echo "- **Package:** ${{ needs.extract-version.outputs.package-name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** ${{ needs.extract-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Tag:** ${{ steps.resolve-tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous tag:** ${{ steps.prev-tag.outputs.previous_tag || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.create-release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGELOG" >> $GITHUB_STEP_SUMMARY

  slack-notification:
    name: Send Slack notification
    needs: [draft-release]
    if: ${{ !failure() && !cancelled() && inputs.slack_channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack message with contributor mentions
        id: slack-message
        env:
          SLACK_TOKEN: ${{ secrets.slack_bot_token || secrets.SLACK_BOT_TOKEN }}
          CHANGELOG: ${{ needs.draft-release.outputs.changelog }}
        run: |
          CONTRIBUTORS="${{ needs.draft-release.outputs.contributors }}"
          EMAILS='${{ needs.draft-release.outputs.contributor_emails }}'

          echo "Contributors received: $CONTRIBUTORS"
          echo "Emails received: $EMAILS"

          MENTIONS=""
          MENTION_SED=""

          for gh_user in $(echo "$CONTRIBUTORS" | tr ',' ' '); do
            if [[ -z "$gh_user" ]]; then continue; fi

            SLACK_ID=""

            EMAIL=$(echo "$EMAILS" | jq -r ".\"${gh_user}\" // empty" 2>/dev/null)
            if [[ -n "$EMAIL" && -n "$SLACK_TOKEN" ]]; then
              LOOKUP_RESPONSE=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
                "https://slack.com/api/users.lookupByEmail?email=${EMAIL}")
              SLACK_ID=$(echo "$LOOKUP_RESPONSE" | jq -r '.user.id // empty' 2>/dev/null)
              SLACK_OK=$(echo "$LOOKUP_RESPONSE" | jq -r '.ok' 2>/dev/null)
              SLACK_ERR=$(echo "$LOOKUP_RESPONSE" | jq -r '.error // empty' 2>/dev/null)
              echo "Slack lookup for $gh_user: email=$EMAIL, ok=$SLACK_OK, error=$SLACK_ERR, slack_id=$SLACK_ID"
            else
              echo "Slack lookup for $gh_user: no email found"
            fi

            if [[ -n "$SLACK_ID" ]]; then
              MENTIONS+="<@${SLACK_ID}> "
              MENTION_SED+="s/@${gh_user}/<@${SLACK_ID}>/g;"
            else
              MENTIONS+="<https://github.com/${gh_user}|${gh_user}> "
              MENTION_SED+="s/@${gh_user}/<https:\/\/github.com\/${gh_user}|${gh_user}>/g;"
            fi
          done

          echo "Final mentions: $MENTIONS"

          # Transform changelog for Slack (markdown to mrkdwn, resolve @mentions)
          SLACK_CHANGELOG=""
          if [[ -n "$CHANGELOG" ]]; then
            SLACK_CHANGELOG=$(echo "$CHANGELOG" | \
              sed 's/^## \(.*\)$/*\1*/g' | \
              sed 's/^### \(.*\)$/*\1*/g' | \
              sed 's/\[\([^]]*\)\](\([^)]*\))/<\2|\1>/g')

            if [[ -n "$MENTION_SED" ]]; then
              SLACK_CHANGELOG=$(echo "$SLACK_CHANGELOG" | sed "$MENTION_SED")
            fi
            # Remaining @usernames that weren't resolved
            SLACK_CHANGELOG=$(echo "$SLACK_CHANGELOG" | sed 's/by @\([a-zA-Z0-9_-]*\)/by <https:\/\/github.com\/\1|\1>/g')
          fi

          echo "mentions=$MENTIONS" >> $GITHUB_OUTPUT

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "slack_changelog<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$SLACK_CHANGELOG" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        id: slack-post
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token || secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ inputs.slack_channel }}"
            text: "New Draft Release: ${{ needs.draft-release.outputs.tag_name }} for ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*New Draft Release:* <${{ needs.draft-release.outputs.release_url }}|${{ needs.draft-release.outputs.tag_name }}>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* `${{ github.repository }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Contributors:* ${{ steps.slack-message.outputs.mentions }}"
              - type: "divider"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "View Release"
                    url: "${{ needs.draft-release.outputs.release_url }}"
                    style: "primary"

      - name: Post changelog in thread
        env:
          SLACK_TOKEN: ${{ secrets.slack_bot_token || secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANGELOG: ${{ steps.slack-message.outputs.slack_changelog }}
          CHANNEL: ${{ inputs.slack_channel }}
          SLACK_POST_RESPONSE: ${{ steps.slack-post.outputs.response }}
        run: |
          THREAD_TS=$(echo "$SLACK_POST_RESPONSE" | jq -r '.ts // empty' 2>/dev/null)
          echo "Thread ts: $THREAD_TS, Changelog: ${#SLACK_CHANGELOG} characters"

          if [[ -z "$THREAD_TS" ]]; then
            echo "No thread timestamp, skipping"
            exit 0
          fi

          if [[ -z "$SLACK_CHANGELOG" ]]; then
            echo "No changelog, skipping"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg thread_ts "$THREAD_TS" \
            --arg text "$SLACK_CHANGELOG" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Thread post result: $(echo "$RESPONSE" | jq -c '{ok: .ok, error: .error}')"
