name: Reusable library workflow to build and publish a yarn library

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to use"
        type: string
        required: false
        default: "22.2.0"
      registry:
        description: "NPM registry to use"
        type: string
        required: false
        default: "npm.pkg.github.com"
      access:
        description: "Package access. public / restricted"
        type: string
        required: false
        default: "restricted"
      auth-key:
        description: "Auth key to use inside ~/.npmrc"
        type: string
        required: false
        default: "authToken"
      disable-unit-test:
        description: "Disable unit testing job"
        type: string
        required: false
        default: "false"
      disable-integration-test:
        description: "Disable integration testing job"
        type: string
        required: false
        default: "false"
      disable-publish:
        description: "Disable the library publish job"
        type: boolean
        required: false
        default: false
      disable-vulnerability-analysis:
        description: "Disable vulnerability analysis job"
        type: boolean
        required: false
        default: false
      gh-advanced-security:
        description: "Enable if you have GitHub Advanced Security"
        type: boolean
        required: false
        default: false
      code-quality-info-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 10
      code-quality-minor-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 5
      code-quality-major-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 1
      code-quality-critical-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      code-quality-blocker-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      slack-releases-channel:
        description: "Slack channel ID for release pipeline notifications. If empty, no notification is sent"
        type: string
        required: false
        default: ""
      slack-failure-channel:
        description: "Slack channel ID for pipeline failure notifications. Pipeline failure notifications."
        type: string
        required: false
        default: ""
      publish-environment:
        description: "GitHub Environment for the publish job. Enables approval gates and environment-specific secrets. If empty, no environment is used"
        type: string
        required: false
        default: ""
      publish-environment-url:
        description: "URL shown in the GitHub deployments view for the publish environment"
        type: string
        required: false
        default: ""
    secrets:
      pub-auth-value:
        description: "Auth value to use inside ~/.npmrc for publishing. Defaults to github.token"
        required: false
      read-auth-value:
        description: "Auth value to use inside ~/.npmrc for reading. Defaults to secrets.PACKAGES_READ" # Remember that the github.token only has access to the current repo packages
        required: false
      slack-bot-token:
        description: "Slack Bot User OAuth Token (xoxb-...). Required scopes: chat:write, channels:history, groups:history. Falls back to org/repo-level SLACK_BOT_TOKEN secret"
        required: false
      codecov-token:
        description: "Codecov token for private repos. Public repos can leave this empty."
        required: false
    outputs:
      package-name:
        description: "The npm package name"
        value: ${{ jobs.validate-version.outputs.package-name }}
      package-scope:
        description: "The npm package scope"
        value: ${{ jobs.validate-version.outputs.package-scope }}
      package-version:
        description: "The package version"
        value: ${{ jobs.validate-version.outputs.package-version }}

jobs:
  slack-release-start:
    name: Notify release started
    if: ${{ inputs.slack-releases-channel != '' && github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    outputs:
      thread-ts: ${{ steps.status.outputs.thread_ts }}
    steps:
      - name: Find draft message and set running status
        id: status
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-releases-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then
            echo "No Slack token, skipping"
            exit 0
          fi

          TAG="${{ github.ref_name }}"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=50")

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then
            echo "conversations.history failed: $(echo "$HISTORY" | jq -r '.error')"
            exit 0
          fi

          THREAD_TS=$(echo "$HISTORY" | jq -r --arg tag "$TAG" \
            '[.messages[] | select(.text | contains($tag))][0].ts // empty')

          if [[ -z "$THREAD_TS" ]]; then
            echo "Draft message not found for tag $TAG"
            exit 0
          fi

          echo "thread_ts=$THREAD_TS" >> $GITHUB_OUTPUT

          RELEASE_URL="${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          ORIGINAL_BLOCKS=$(echo "$HISTORY" | jq --arg ts "$THREAD_TS" \
            '[.messages[] | select(.ts == $ts)][0].blocks')

          PIPELINE_BTN=$(jq -n --arg url "$RUN_URL" \
            '{type: "button", text: {type: "plain_text", text: "View Pipeline"}, url: $url}')

          UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --arg url "$RELEASE_URL" --argjson pipeline_btn "$PIPELINE_BTN" \
            'map(if .type == "actions" then
              .elements = [(.elements[] | if .text.text == "View Release" then .url = $url | .text.text = "View Published Release" else . end)] + [$pipeline_btn]
            else . end)
            + [{type: "context", elements: [{type: "mrkdwn", text: ":hourglass_flowing_sand: Release pipeline running..."}]}]')

          UPDATE_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg ts "$THREAD_TS" \
            --argjson blocks "$UPDATED_BLOCKS" \
            '{channel: $channel, ts: $ts, blocks: $blocks}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD")

          echo "Status update: $(echo "$RESPONSE" | jq -c '{ok: .ok, error: .error}')"

  validate-version:
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}
      package-scope: ${{ steps.package.outputs.scope }}
      package-version: ${{ steps.package.outputs.version }}
      published-version: ${{ steps.published.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package data from package.json
        id: package
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
          
          if [[ $PACKAGE_NAME != @*/* ]]; then
            echo "Error: Package name must be scoped (e.g., @scope/package-name)."
            exit 1
          fi
          
          PACKAGE_SCOPE=$(echo $PACKAGE_NAME | cut -d'/' -f1)
          echo "scope=$PACKAGE_SCOPE" >> $GITHUB_OUTPUT

      - name: Get published version from GitHub Package Registry
        id: published
        run: |
          echo "//${{ inputs.registry }}/:_${{ inputs.auth-key }}=${{ secrets.pub-auth-value || github.token }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          PUBLISHED_VERSION=$(npm view ${{ steps.package.outputs.name }} version --registry=https://${{ inputs.registry }} || echo "0.0.0")
          echo "version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install semver package
        run: |
          rm -f package.json package-lock.json yarn.lock
          npm install semver

      - name: Validate version
        run: |
          export PUBLISHED_VERSION=${{ steps.published.outputs.version }}
          export PACKAGE_VERSION=${{ steps.package.outputs.version }}
          node -e ' 
            const semver = require("semver");
            const current = process.env.PUBLISHED_VERSION || "0.0.0";
            const next = process.env.PACKAGE_VERSION;
            if (!semver.valid(next)) {
              console.error(`Error: package version is not a valid SemVer version. Version: ${next}`);
              process.exit(1);
            }
            if (!semver.valid(current)) {
              console.error(`Error: published version is not a valid SemVer version. Version: ${current}`);
              process.exit(1);
            }
            if (!semver.gt(next, current)) {
              console.error(`Error: Version ${next} is not greater than published ${current}`);
              process.exit(1);
            }
          '

  notify-running:
    name: Mark previous failure as running
    if: ${{ inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update previous failure message to running
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SEARCH_TEXT=":x: *Pipeline failed* in \`${REPO}\` on \`${REF}\`"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=20")

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then exit 0; fi

          FAILURE_MSG=$(echo "$HISTORY" | jq --arg search "$SEARCH_TEXT" \
            '[.messages[] | select(.blocks != null) | select(.blocks[].text.text? // "" | contains($search))][0] // empty')

          if [[ -z "$FAILURE_MSG" || "$FAILURE_MSG" == "null" ]]; then exit 0; fi

          FAILURE_TS=$(echo "$FAILURE_MSG" | jq -r '.ts')
          FAILED_URL=$(echo "$FAILURE_MSG" | jq -r '[.blocks[] | select(.type == "actions") | .elements[] | select(.text.text == "View Failed Run") | .url][0] // empty')

          UPDATED_BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg failed_url "$FAILED_URL" --arg new_url "$RUN_URL" '[
            {type: "section", text: {type: "mrkdwn", text: (":x: *Pipeline failed* in `" + $repo + "` on `" + $ref + "`")}},
            {type: "actions", elements: [
              {type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $failed_url, style: "danger"},
              {type: "button", text: {type: "plain_text", text: "View New Run"}, url: $new_url}
            ]},
            {type: "context", elements: [{type: "mrkdwn", text: ":hourglass_flowing_sand: Pipeline running again..."}]}
          ]')

          curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg channel "$CHANNEL" --arg ts "$FAILURE_TS" --argjson blocks "$UPDATED_BLOCKS" \
              '{channel: $channel, ts: $ts, blocks: $blocks}')" > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure npm registry globally in ~/.npmrc to download dependencies from the same scope as the project
        env:
          AUTH_VALUE: ${{ secrets.read-auth-value || secrets.PACKAGES_READ }}
        if: ${{ env.AUTH_VALUE != '' }}
        run: |
          echo "${{ needs.validate-version.outputs.package-scope }}:registry=https://${{ inputs.registry }}" >> ~/.npmrc
          echo "//${{ inputs.registry }}/:_${{ inputs.auth-key }}=${{ secrets.read-auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Run build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-build
          include-hidden-files: true
          retention-days: 2
          path: |
            ./package.json
            ./dist

  unit-test:
    name: Unit tests
    needs: [build]
    if: ${{ inputs.disable-unit-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure npm registry globally in ~/.npmrc to download dependencies from the same scope as the project
        env:
          AUTH_VALUE: ${{ secrets.read-auth-value || secrets.PACKAGES_READ }}
        if: ${{ env.AUTH_VALUE != '' }}
        run: |
          echo "${{ needs.validate-version.outputs.package-scope }}:registry=https://${{ inputs.registry }}" >> ~/.npmrc
          echo "//${{ inputs.registry }}/:_${{ inputs.auth-key }}=${{ secrets.read-auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Run unit-tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:unit
          test-label: Unit

      - name: Run storybook tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:storybook:ci
          test-label: Storybook
          coverage-summary-location: ./test/.storybook-coverage/coverage-summary.json
          coverage-json-location: ./test/.storybook-coverage/coverage-final.json
          coverage-report-location: ./test/.storybook-coverage/cobertura-coverage.xml
          junit-report-location: ./test/.storybook-coverage/junit.xml

      - name: Merge unit + storybook coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          npm install -g nyc
          mkdir -p .nyc_merge_input
          cp test/.coverage/coverage-final.json .nyc_merge_input/unit.json 2>/dev/null || true
          cp test/.storybook-coverage/coverage-final.json .nyc_merge_input/storybook.json 2>/dev/null || true
          mkdir -p .nyc_output
          nyc merge .nyc_merge_input .nyc_output/coverage.json
          nyc report --reporter=json --report-dir=test/.merged-unit-coverage

      - name: Upload merged unit coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          retention-days: 2
          path: test/.merged-unit-coverage/coverage-final.json

      - name: Upload to Codecov
        if: ${{ !cancelled() && inputs.disable-integration-test == 'true' && secrets.codecov-token != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: test/.merged-unit-coverage/coverage-final.json
          token: ${{ secrets.codecov-token }}
          fail_ci_if_error: false

  integration-test:
    name: Integration tests
    needs: [build]
    if: ${{ inputs.disable-integration-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure npm registry globally in ~/.npmrc to download dependencies from the same scope as the project
        env:
          AUTH_VALUE: ${{ secrets.read-auth-value || secrets.PACKAGES_READ }}
        if: ${{ env.AUTH_VALUE != '' }}
        run: |
          echo "${{ needs.validate-version.outputs.package-scope }}:registry=https://${{ inputs.registry }}" >> ~/.npmrc
          echo "//${{ inputs.registry }}/:_${{ inputs.auth-key }}=${{ secrets.read-auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Run integration-tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:integration
          test-label: Integration
          artifact-suffix: integration
          codecov-token: ${{ inputs.disable-unit-test == 'true' && secrets.codecov-token || '' }}


  merge-test-reports:
    name: Merge test reports
    if: ${{ !failure() && !cancelled() && inputs.disable-unit-test != 'true' && inputs.disable-integration-test != 'true' }}
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Merge test reports
        uses: phorus-group/yarn-merge-reports-action@main
        with:
          test-artifact-1: coverage-unit
          test-artifact-2: coverage-integration
          codecov-token: ${{ secrets.codecov-token }}

  # This is giving us issues with GHA runners, so we are disabling it for now
  # code-quality:
  #   name: Code quality check
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Check code quality
  #       uses: phorus-group/code-quality-action@main
  #       with:
  #         info-threshold: ${{ inputs.code-quality-info-threshold }}
  #         minor-threshold: ${{ inputs.code-quality-minor-threshold }}
  #         major-threshold: ${{ inputs.code-quality-major-threshold }}
  #         critical-threshold: ${{ inputs.code-quality-critical-threshold }}
  #         blocker-threshold: ${{ inputs.code-quality-blocker-threshold }}

  vulnerability-analysis:
    name: Vulnerability analysis
    needs: [build]
    if: ${{ !inputs.disable-vulnerability-analysis }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyse project for vulnerabilities
        uses: phorus-group/vulnerability-analysis-action@main
        with:
          skip-dirs: node_modules,.git
          upload-sarif: ${{ inputs.gh-advanced-security }}

  publish:
    name: Publish library
    needs: [validate-version,unit-test,integration-test,vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && !inputs.disable-publish && (github.ref_name == github.event.repository.default_branch || (github.event_name == 'release' && github.event.action == 'published')) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish-environment || null }}
      url: ${{ inputs.publish-environment-url || null }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lib-build

      - name: Configure npm registry globally in ~/.npmrc
        run: |
          echo "${{ needs.validate-version.outputs.package-scope }}:registry=https://${{ inputs.registry }}" >> ~/.npmrc
          echo "//${{ inputs.registry }}/:_${{ inputs.auth-key }}=${{ secrets.pub-auth-value || github.token }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Publish package
        run: |
          # Delete the prepare script since it could be running things not compatible with this step, like husky
          npm pkg delete scripts.prepare
          yarn publish --new-version $(jq -r .version package.json) --non-interactive --access ${{ inputs.access }}

      - name: Publish summary
        if: success()
        run: |
          echo "## ✅ Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** ${{ needs.validate-version.outputs.package-scope }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** ${{ needs.validate-version.outputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate-version.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY

  slack-release-end:
    name: Notify release finished
    needs: [slack-release-start, publish]
    if: ${{ always() && needs.slack-release-start.outputs.thread-ts != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update draft message with final status
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-releases-channel }}
          THREAD_TS: ${{ needs.slack-release-start.outputs.thread-ts }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_URL="${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IS_SUCCESS="${{ needs.publish.result == 'success' }}"

          MSG=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&latest=${THREAD_TS}&oldest=${THREAD_TS}&inclusive=true&limit=1")

          ORIGINAL_BLOCKS=$(echo "$MSG" | jq '[.messages[0].blocks[] | select(.type != "context")]')

          if [[ "$IS_SUCCESS" == "true" ]]; then
            STATUS_TEXT=":white_check_mark: Released successfully"
            UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --arg status "$STATUS_TEXT" \
              '. + [{type: "context", elements: [{type: "mrkdwn", text: $status}]}]')
          else
            STATUS_TEXT=":x: Release pipeline failed"
            BUTTON=$(jq -n --arg url "$RUN_URL" \
              '{type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $url, style: "danger"}')
            UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --argjson btn "$BUTTON" --arg status "$STATUS_TEXT" \
              'if any(.type == "actions") then
                map(if .type == "actions" then .elements += [$btn] else . end)
              else . + [{type: "actions", elements: [$btn]}]
              end
              + [{type: "context", elements: [{type: "mrkdwn", text: $status}]}]')
          fi

          UPDATE_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg ts "$THREAD_TS" \
            --argjson blocks "$UPDATED_BLOCKS" \
            '{channel: $channel, ts: $ts, blocks: $blocks}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD")

          echo "Status update: $(echo "$RESPONSE" | jq -c '{ok: .ok, error: .error}')"

          if [[ "$IS_SUCCESS" == "true" ]]; then
            REPLY="*Release pipeline completed* for <${RELEASE_URL}|${TAG}> in \`${{ github.repository }}\`"
          else
            REPLY="*Release pipeline failed* for <${RELEASE_URL}|${TAG}> in \`${{ github.repository }}\` — <${RUN_URL}|view run>"
          fi

          REPLY_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg thread_ts "$THREAD_TS" \
            --arg text "$REPLY" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text, unfurl_links: false, unfurl_media: false}')

          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REPLY_PAYLOAD" > /dev/null

  enforce-all-checks:
    name: Enforce all checks
    needs: [validate-version,unit-test,integration-test,vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && github.ref_name != github.event.repository.default_branch && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Enforce all checks
        uses: poseidon/wait-for-status-checks@main
        with:
          token: ${{ github.token }}
          ignore_pattern: ".*Enforce all checks"

  notify-failure:
    name: Notify failure
    needs: [build, unit-test, integration-test, vulnerability-analysis, publish, enforce-all-checks]
    if: ${{ always() && failure() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send or update Slack failure notification
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          SEARCH_TEXT=":x: *Pipeline failed* in \`${REPO}\` on \`${REF}\`"

          echo "Searching for existing failure message for $REPO on $REF..."

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=20")

          EXISTING_MSG=$(echo "$HISTORY" | jq --arg search "$SEARCH_TEXT" \
            '[.messages[] | select(.blocks != null) | select(.blocks[].text.text? // "" | contains($search))][0] // empty' 2>/dev/null)

          if [[ -n "$EXISTING_MSG" && "$EXISTING_MSG" != "null" ]]; then
            echo "Found existing failure message, updating with new failure..."
            EXISTING_TS=$(echo "$EXISTING_MSG" | jq -r '.ts')

            CURRENT_CONTEXT=$(echo "$EXISTING_MSG" | jq -r '[.blocks[] | select(.type == "context") | .elements[].text][0] // ""')
            if echo "$CURRENT_CONTEXT" | grep -q "attempt"; then
              ATTEMPT=$(echo "$CURRENT_CONTEXT" | grep -oP '\d+' | tail -1)
              ATTEMPT=$((ATTEMPT + 1))
            else
              ATTEMPT=2
            fi

            BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg url "$RUN_URL" --arg attempt "$ATTEMPT" '[
              {type: "section", text: {type: "mrkdwn", text: (":x: *Pipeline failed* in `" + $repo + "` on `" + $ref + "`")}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View Latest Failed Run"}, url: $url, style: "danger"}]},
              {type: "context", elements: [{type: "mrkdwn", text: (":red_circle: Failed (attempt " + $attempt + ")")}]}
            ]')

            curl -s -X POST "https://slack.com/api/chat.update" \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg channel "$CHANNEL" --arg ts "$EXISTING_TS" --argjson blocks "$BLOCKS" \
                '{channel: $channel, ts: $ts, blocks: $blocks}')" > /dev/null
            echo "Updated existing failure message (attempt $ATTEMPT)"
          else
            echo "No existing failure message found, posting new one..."
            BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg url "$RUN_URL" '[
              {type: "section", text: {type: "mrkdwn", text: (":x: *Pipeline failed* in `" + $repo + "` on `" + $ref + "`")}},
              {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $url, style: "danger"}]},
              {type: "context", elements: [{type: "mrkdwn", text: ":red_circle: Failed"}]}
            ]')

            curl -s -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg channel "$CHANNEL" --argjson blocks "$BLOCKS" \
                '{channel: $channel, blocks: $blocks, unfurl_links: false, unfurl_media: false}')" > /dev/null
            echo "Posted new failure message"
          fi

  notify-recovery:
    name: Notify recovery
    needs: [build, unit-test, integration-test, vulnerability-analysis, publish, enforce-all-checks]
    if: ${{ always() && !failure() && !cancelled() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update previous failure message if exists
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SEARCH_TEXT=":x: *Pipeline failed* in \`${REPO}\` on \`${REF}\`"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=20")

          echo "Searching for previous failure message for $REPO on $REF..."

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then
            echo "Could not read channel history"
            exit 0
          fi

          FAILURE_MSG=$(echo "$HISTORY" | jq --arg search "$SEARCH_TEXT" \
            '[.messages[] | select(.blocks != null) | select(.blocks[].text.text? // "" | contains($search))][0] // empty')

          if [[ -z "$FAILURE_MSG" || "$FAILURE_MSG" == "null" ]]; then
            echo "No previous failure message found, nothing to recover"
            exit 0
          fi

          echo "Found previous failure message, marking as recovered..."
          FAILURE_TS=$(echo "$FAILURE_MSG" | jq -r '.ts')
          FAILED_URL=$(echo "$FAILURE_MSG" | jq -r '[.blocks[] | select(.type == "actions") | .elements[] | select(.text.text == "View Failed Run" or .text.text == "View Latest Failed Run") | .url][0] // empty')

          UPDATED_BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg failed_url "$FAILED_URL" --arg fix_url "$RUN_URL" '[
            {type: "section", text: {type: "mrkdwn", text: (":white_check_mark: *Pipeline recovered* in `" + $repo + "` on `" + $ref + "`")}},
            {type: "actions", elements: [
              {type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $failed_url},
              {type: "button", text: {type: "plain_text", text: "View Recovery Run"}, url: $fix_url, style: "primary"}
            ]},
            {type: "context", elements: [{type: "mrkdwn", text: ":large_green_circle: Recovered"}]}
          ]')

          curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg channel "$CHANNEL" --arg ts "$FAILURE_TS" --argjson blocks "$UPDATED_BLOCKS" \
              '{channel: $channel, ts: $ts, blocks: $blocks}')" > /dev/null
          echo "Updated failure message to recovered"
