name: Reusable gradle workflow to build and publish a docker image to GHCR

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version to use"
        type: string
        required: false
        default: "21"
      java-distribution:
        description: "Java distribution to use"
        type: string
        required: false
        default: "temurin"
      registry-username:
        description: "Username for registry authentication (used for reading dependencies). Default: github.actor"
        type: string
        required: false
        default: ""
      registry:
        description: "Registry URL for reading dependencies. Default: https://maven.pkg.github.com"
        type: string
        required: false
        default: "https://maven.pkg.github.com"
      build-and-test:
        description: "Build and test at the same time"
        type: boolean
        required: false
        default: false
      disable-unit-test:
        description: "Disable unit testing job"
        type: string
        required: false
        default: "false"
      disable-integration-test:
        description: "Disable integration testing job"
        type: string
        required: false
        default: "false"
      disable-vulnerability-analysis:
        description: "Disable vulnerability analysis job"
        type: boolean
        required: false
        default: false
      disable-docker:
        description: "Disable the Docker build and push job"
        type: boolean
        required: false
        default: false
      disable-merge-test-reports:
        description: "Disable merging the test reports"
        type: string
        required: false
        default: "false"
      gh-advanced-security:
        description: "Enable if you have GitHub Advanced Security"
        type: boolean
        required: false
        default: false
      code-quality-info-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 10
      code-quality-minor-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 5
      code-quality-major-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 1
      code-quality-critical-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      code-quality-blocker-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
    secrets:
      read-auth-value:
        description: "Auth value for reading dependencies. Default: github.token"
        required: false
    outputs:
      image:
        description: "The Docker image reference (registry/repo:tag)"
        value: ${{ jobs.docker.outputs.image }}
      image-tag:
        description: "The Docker image tag only"
        value: ${{ jobs.docker.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        uses: phorus-group/gradle-build-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          build-and-test: ${{ inputs.build-and-test }}
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  unit-test:
    name: Unit tests
    needs: [build]
    if: ${{ inputs.disable-unit-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit-tests
        uses: phorus-group/gradle-test-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          commands: check unitTest -x :test
          artifact-suffix: unit
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  integration-test:
    name: Integration tests
    needs: [build]
    if: ${{ inputs.disable-integration-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration-tests
        uses: phorus-group/gradle-test-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          commands: integrationTest
          artifact-suffix: integration
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  merge-test-reports:
    name: Merge test reports
    if: ${{ !failure() && !cancelled() && inputs.disable-merge-test-reports != 'true' && inputs.disable-integration-test != 'true' && inputs.disable-unit-test != 'true' }}
    needs: [unit-test,integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Merge test reports
        uses: phorus-group/gradle-merge-reports-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          command: jacocoMergeReports
          test-artifact-1: gradle-tests-unit
          test-artifact-2: gradle-tests-integration

  # This is giving us issues with GHA runners, so we are disabling it for now
  # code-quality:
  #   name: Code quality check
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Check code quality
  #       uses: phorus-group/code-quality-action@main
  #       with:
  #         info-threshold: ${{ inputs.code-quality-info-threshold }}
  #         minor-threshold: ${{ inputs.code-quality-minor-threshold }}
  #         major-threshold: ${{ inputs.code-quality-major-threshold }}
  #         critical-threshold: ${{ inputs.code-quality-critical-threshold }}
  #         blocker-threshold: ${{ inputs.code-quality-blocker-threshold }}

  vulnerability-analysis:
    name: Vulnerability analysis
    needs: [build]
    if: ${{ !inputs.disable-vulnerability-analysis }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gradle-build

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: "Generate gradle lockfile"
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { dependencyLocking { lockAllConfigurations() } }" >> ~/.gradle/init.gradle
          ./gradlew dependencies --write-locks
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

      - name: Analyse project for vulnerabilities
        uses: phorus-group/vulnerability-analysis-action@main
        with:
          skip-dirs: .git
          upload-sarif: ${{ inputs.gh-advanced-security }}

  docker:
    name: Docker build and push
    needs: [unit-test,integration-test,vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && !(inputs.disable-docker && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      image-tag: ${{ steps.docker-push.outputs.image-tag }}
    steps:
      - name: Download build artifacts
        if: ${{ !inputs.disable-docker }}
        uses: actions/download-artifact@v4
        with:
          name: gradle-build

      - name: Build and push Docker image
        id: docker-push
        if: ${{ !inputs.disable-docker }}
        uses: phorus-group/docker-action@main
        with:
          vulnerability-analysis: false # Disabled because almost every image that is not alpine has more than 10 vulnerabilities
          dockerfile-path: "dockerfiles/Dockerfile.gradle"
          push: true

  enforce-all-checks:
    name: Enforce all checks
    needs: [docker]
    if: ${{ !failure() && !cancelled() && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Enforce all checks
        uses: poseidon/wait-for-status-checks@main
        with:
          token: ${{ github.token }}
          ignore_pattern: ".*Enforce all checks"
