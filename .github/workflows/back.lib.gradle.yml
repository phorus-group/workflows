  enforce-all-checks:
    name: Enforce all checks
    needs: [validate-version,unit-test,integration-test,code-quality,vulnerability-analysis]
    if: ${{ github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Enforce all checks
        uses: poseidon/wait-for-status-checks@main
        with:
          token: ${{ github.token }}
          ignore_pattern: ".*Enforce all checks"
