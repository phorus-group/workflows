name: Reusable library workflow to build and publish a gradle library

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version to use"
        type: string
        required: false
        default: "21"
      java-distribution:
        description: "Java distribution to use"
        type: string
        required: false
        default: "temurin"
      publish-task:
        description: "Gradle publish task to run. Default: 'publish'. Examples: 'publish' (maven-publish plugin for GitHub/JFrog/Nexus), 'publishToMavenCentral' (vanniktech plugin)"
        type: string
        required: false
        default: "publish"
      registry-username:
        description: "Username for registry authentication (used for reading dependencies, metadata, and publishing). Default: github.actor. Examples: GitHub actor, Maven Central token username"
        type: string
        required: false
        default: ""
      metadata-base-url:
        description: "Base URL for Maven metadata. Will be constructed from github.repository if not provided. Examples: 'https://maven.pkg.github.com/owner/repo' (GitHub), 'https://repo1.maven.org/maven2' (Maven Central)"
        type: string
        required: false
        default: ""
      metadata-auth-method:
        description: "Auth method for metadata: 'header' (uses Authorization: Bearer), 'basic' (uses username:password), 'none'"
        type: string
        required: false
        default: "header"
      registry:
        description: "Registry URL for reading dependencies and publishing. Default: https://maven.pkg.github.com. Examples: 'https://maven.pkg.github.com' (GitHub), 'https://repo1.maven.org/maven2' (Maven Central)"
        type: string
        required: false
        default: "https://maven.pkg.github.com"
      build-and-test:
        description: "Build and test in a single step. When true, unit-test, integration-test, and merge-test-reports jobs are skipped."
        type: boolean
        required: false
        default: false
      disable-unit-test:
        description: "Disable unit testing job"
        type: string
        required: false
        default: "false"
      disable-integration-test:
        description: "Disable integration testing job"
        type: string
        required: false
        default: "false"
      disable-publish:
        description: "Disable the library publish job"
        type: boolean
        required: false
        default: false
      disable-vulnerability-analysis:
        description: "Disable vulnerability analysis job"
        type: boolean
        required: false
        default: false
      gh-advanced-security:
        description: "Enable if you have GitHub Advanced Security"
        type: boolean
        required: false
        default: false
      code-quality-info-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 10
      code-quality-minor-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 5
      code-quality-major-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 1
      code-quality-critical-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      code-quality-blocker-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      slack-releases-channel:
        description: "Slack channel ID for release pipeline notifications. If empty, no notification is sent"
        type: string
        required: false
        default: ""
      slack-failure-channel:
        description: "Slack channel ID for pipeline failure notifications. Pipeline failure notifications."
        type: string
        required: false
        default: ""
      publish-environment:
        description: "GitHub Environment for the publish job. Enables approval gates and environment-specific secrets. If empty, no environment is used"
        type: string
        required: false
        default: ""
      publish-environment-url:
        description: "URL shown in the GitHub deployments view for the publish environment"
        type: string
        required: false
        default: ""
    secrets:
      read-auth-value:
        description: "Auth value for reading dependencies and metadata. Default: github.token"
        required: false
      pub-auth-value:
        description: "Auth value for publishing. Default: github.token"
        required: false
      signing-key:
        description: "GPG signing key (ASCII-armored). Required for Maven Central, optional for others"
        required: false
      signing-password:
        description: "GPG signing key password. Required if signing-key is provided"
        required: false
      slack-bot-token:
        description: "Slack Bot User OAuth Token (xoxb-...). Required scopes: chat:write, channels:history, groups:history. Falls back to org/repo-level SLACK_BOT_TOKEN secret"
        required: false
      codecov-token:
        description: "Codecov token for private repos. Public repos can leave this empty."
        required: false
    outputs:
      package-group:
        description: "The Maven group ID"
        value: ${{ jobs.validate-version.outputs.package-group }}
      package-name:
        description: "The artifact name"
        value: ${{ jobs.validate-version.outputs.package-name }}
      package-version:
        description: "The package version"
        value: ${{ jobs.validate-version.outputs.package-version }}

jobs:
  slack-release-start:
    name: Notify release started
    if: ${{ inputs.slack-releases-channel != '' && github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    outputs:
      thread-ts: ${{ steps.status.outputs.thread_ts }}
    steps:
      - name: Find draft message and set running status
        id: status
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-releases-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then
            echo "No Slack token, skipping"
            exit 0
          fi

          TAG="${{ github.ref_name }}"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=50")

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then
            echo "conversations.history failed: $(echo "$HISTORY" | jq -r '.error')"
            exit 0
          fi

          THREAD_TS=$(echo "$HISTORY" | jq -r --arg tag "$TAG" \
            '[.messages[] | select(.text | contains($tag))][0].ts // empty')

          if [[ -z "$THREAD_TS" ]]; then
            echo "Draft message not found for tag $TAG"
            exit 0
          fi

          echo "thread_ts=$THREAD_TS" >> $GITHUB_OUTPUT

          RELEASE_URL="${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          ORIGINAL_BLOCKS=$(echo "$HISTORY" | jq --arg ts "$THREAD_TS" \
            '[.messages[] | select(.ts == $ts)][0].blocks')

          PIPELINE_BTN=$(jq -n --arg url "$RUN_URL" \
            '{type: "button", text: {type: "plain_text", text: "View Pipeline"}, url: $url}')

          UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --arg url "$RELEASE_URL" --argjson pipeline_btn "$PIPELINE_BTN" \
            'map(if .type == "actions" then
              .elements = [(.elements[] | if .text.text == "View Release" then .url = $url | .text.text = "View Published Release" else . end)] + [$pipeline_btn]
            else . end)
            + [{type: "context", elements: [{type: "mrkdwn", text: ":hourglass_flowing_sand: Release pipeline running..."}]}]')

          UPDATE_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg ts "$THREAD_TS" \
            --argjson blocks "$UPDATED_BLOCKS" \
            '{channel: $channel, ts: $ts, blocks: $blocks}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD")

          echo "Status update: $(echo "$RESPONSE" | jq -c '{ok: .ok, error: .error}')"

  validate-version:
    runs-on: ubuntu-latest
    outputs:
      package-group: ${{ steps.package.outputs.group }}
      package-name: ${{ steps.package.outputs.name }}
      package-version: ${{ steps.package.outputs.version }}
      published-version: ${{ steps.published.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package data from Gradle build file
        id: package
        run: |
          PACKAGE_GROUP=$(./gradlew properties --no-daemon --console=plain -q | grep "^group:" | awk '{print $2}')
          PACKAGE_VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
          PACKAGE_NAME=$(./gradlew properties --no-daemon --console=plain -q | grep "^name:" | awk '{print $2}')

          echo "Group: $PACKAGE_GROUP"
          echo "Version: $PACKAGE_VERSION"
          echo "Name: $PACKAGE_NAME"

          if [[ -z "$PACKAGE_GROUP" || -z "$PACKAGE_VERSION" || -z "$PACKAGE_NAME" ]]; then
            echo "Error: Could not extract group, version, or name from Gradle properties."
            exit 1
          fi

          echo "group=$PACKAGE_GROUP" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Get published version from registry
        id: published
        run: |
          # Construct metadata URL
          if [[ -z "${{ inputs.metadata-base-url }}" ]]; then
            METADATA_BASE_URL="https://maven.pkg.github.com/${{ github.repository }}"
          else
            METADATA_BASE_URL="${{ inputs.metadata-base-url }}"
          fi

          GROUP_PATH=$(echo "${{ steps.package.outputs.group }}" | tr '.' '/')
          METADATA_URL="${METADATA_BASE_URL}/${GROUP_PATH}/${{ steps.package.outputs.name }}/maven-metadata.xml"

          echo "Fetching metadata from: $METADATA_URL"

          if [[ "${{ inputs.metadata-auth-method }}" == "basic" ]]; then
            PUBLISHED_VERSION=$(curl -u "${{ inputs.registry-username || github.actor }}:${{ secrets.read-auth-value || github.token }}" -s "$METADATA_URL" | grep -oPm1 "<latest>[^<]+" | sed 's/<latest>//' || echo "")
          elif [[ "${{ inputs.metadata-auth-method }}" == "header" ]]; then
            PUBLISHED_VERSION=$(curl -H "Authorization: Bearer ${{ secrets.read-auth-value || github.token }}" -s "$METADATA_URL" | grep -oPm1 "<latest>[^<]+" | sed 's/<latest>//' || echo "")
          else
            PUBLISHED_VERSION=$(curl -s "$METADATA_URL" | grep -oPm1 "<latest>[^<]+" | sed 's/<latest>//' || echo "")
          fi

          if [[ -z "$PUBLISHED_VERSION" ]]; then
            echo "No published version found, using 0.0.0"
            PUBLISHED_VERSION="0.0.0"
          fi

          echo "Extracted published version: $PUBLISHED_VERSION"
          echo "version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semver package
        run: |
          rm -f package.json package-lock.json yarn.lock
          npm install semver

      - name: Validate version
        run: |
          export PUBLISHED_VERSION=${{ steps.published.outputs.version }}
          export PACKAGE_VERSION=${{ steps.package.outputs.version }}
          node -e '
            const semver = require("semver");
            const current = process.env.PUBLISHED_VERSION || "0.0.0";
            const next = process.env.PACKAGE_VERSION;
            if (!semver.valid(next)) {
              console.error(`Error: package version is not a valid SemVer version. Version: ${next}`);
              process.exit(1);
            }
            if (!semver.valid(current)) {
              console.error(`Error: published version is not a valid SemVer version. Version: ${current}`);
              process.exit(1);
            }
            if (!semver.gt(next, current)) {
              console.error(`Error: Version ${next} is not greater than published ${current}`);
              process.exit(1);
            }
            console.log(`✓ Version ${next} is valid and greater than ${current}`);
          '

  notify-running:
    name: Mark previous failure as running
    if: ${{ inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: phorus-group/slack-pipeline-notify-action@main
        with:
          slack-token: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack-failure-channel }}
          status: running

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        uses: phorus-group/gradle-build-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          build-and-test: ${{ inputs.build-and-test }}
          codecov-token: ${{ secrets.codecov-token }}
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  unit-test:
    name: Unit tests
    needs: [build]
    if: ${{ !inputs.build-and-test && inputs.disable-unit-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit-tests
        uses: phorus-group/gradle-test-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          commands: check unitTest -x :test
          artifact-suffix: unit
          codecov-token: ${{ inputs.disable-integration-test == 'true' && secrets.codecov-token || '' }}
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  integration-test:
    name: Integration tests
    needs: [build]
    if: ${{ !inputs.build-and-test && inputs.disable-integration-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration-tests
        uses: phorus-group/gradle-test-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          commands: integrationTest
          artifact-suffix: integration
          codecov-token: ${{ inputs.disable-unit-test == 'true' && secrets.codecov-token || '' }}
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

  merge-test-reports:
    name: Merge test reports
    if: ${{ !failure() && !cancelled() && !inputs.build-and-test && inputs.disable-unit-test != 'true' && inputs.disable-integration-test != 'true' }}
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Merge test reports
        uses: phorus-group/gradle-merge-reports-action@main
        with:
          java-version: ${{ inputs.java-version }}
          java-distribution: ${{ inputs.java-distribution }}
          command: jacocoMergeReports
          test-artifact-1: gradle-tests-unit
          test-artifact-2: gradle-tests-integration
          codecov-token: ${{ secrets.codecov-token }}

  # This is giving us issues with GHA runners, so we are disabling it for now
  # code-quality:
  #   name: Code quality check
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Check code quality
  #       uses: phorus-group/code-quality-action@main
  #       with:
  #         info-threshold: ${{ inputs.code-quality-info-threshold }}
  #         minor-threshold: ${{ inputs.code-quality-minor-threshold }}
  #         major-threshold: ${{ inputs.code-quality-major-threshold }}
  #         critical-threshold: ${{ inputs.code-quality-critical-threshold }}
  #         blocker-threshold: ${{ inputs.code-quality-blocker-threshold }}

  vulnerability-analysis:
    name: Vulnerability analysis
    needs: [build]
    if: ${{ !inputs.disable-vulnerability-analysis }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gradle-build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Generate gradle lockfile
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { dependencyLocking { lockAllConfigurations() } }" >> ~/.gradle/init.gradle
          ./gradlew dependencies --write-locks
        env:
          ORG_GRADLE_PROJECT_readUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_readPassword: ${{ secrets.read-auth-value || github.token }}

      - name: Analyse project for vulnerabilities
        uses: phorus-group/vulnerability-analysis-action@main
        with:
          skip-dirs: .git
          upload-sarif: ${{ inputs.gh-advanced-security }}

  publish:
    name: Publish library
    needs: [validate-version, unit-test, integration-test, vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && !inputs.disable-publish && (github.ref_name == github.event.repository.default_branch || (github.event_name == 'release' && github.event.action == 'published')) }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish-environment || null }}
      url: ${{ inputs.publish-environment-url || null }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gradle-build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Publish package
        run: ./gradlew ${{ inputs.publish-task }} --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_publishUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_publishPassword: ${{ secrets.pub-auth-value || github.token }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ inputs.registry-username || github.actor }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.pub-auth-value || github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signing-key }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signing-password }}

      - name: Publish summary
        if: success()
        run: |
          echo "## ✅ Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Group:** ${{ needs.validate-version.outputs.package-group }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${{ needs.validate-version.outputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate-version.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY

  slack-release-end:
    name: Notify release finished
    needs: [slack-release-start, publish]
    if: ${{ always() && needs.slack-release-start.outputs.thread-ts != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update draft message with final status
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-releases-channel }}
          THREAD_TS: ${{ needs.slack-release-start.outputs.thread-ts }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_URL="${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, github.ref_name) }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IS_SUCCESS="${{ needs.publish.result == 'success' }}"

          MSG=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&latest=${THREAD_TS}&oldest=${THREAD_TS}&inclusive=true&limit=1")

          ORIGINAL_BLOCKS=$(echo "$MSG" | jq '[.messages[0].blocks[] | select(.type != "context")]')

          if [[ "$IS_SUCCESS" == "true" ]]; then
            STATUS_TEXT=":white_check_mark: Released successfully"
            UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --arg status "$STATUS_TEXT" \
              '. + [{type: "context", elements: [{type: "mrkdwn", text: $status}]}]')
          else
            STATUS_TEXT=":x: Release pipeline failed"
            BUTTON=$(jq -n --arg url "$RUN_URL" \
              '{type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $url, style: "danger"}')
            UPDATED_BLOCKS=$(echo "$ORIGINAL_BLOCKS" | jq --argjson btn "$BUTTON" --arg status "$STATUS_TEXT" \
              'if any(.type == "actions") then
                map(if .type == "actions" then .elements += [$btn] else . end)
              else . + [{type: "actions", elements: [$btn]}]
              end
              + [{type: "context", elements: [{type: "mrkdwn", text: $status}]}]')
          fi

          UPDATE_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg ts "$THREAD_TS" \
            --argjson blocks "$UPDATED_BLOCKS" \
            '{channel: $channel, ts: $ts, blocks: $blocks}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_PAYLOAD")

          echo "Status update: $(echo "$RESPONSE" | jq -c '{ok: .ok, error: .error}')"

          if [[ "$IS_SUCCESS" == "true" ]]; then
            REPLY="*Release pipeline completed* for <${RELEASE_URL}|${TAG}> in \`${{ github.repository }}\`"
          else
            REPLY="*Release pipeline failed* for <${RELEASE_URL}|${TAG}> in \`${{ github.repository }}\` — <${RUN_URL}|view run>"
          fi

          REPLY_PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg thread_ts "$THREAD_TS" \
            --arg text "$REPLY" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text, unfurl_links: false, unfurl_media: false}')

          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REPLY_PAYLOAD" > /dev/null

  enforce-all-checks:
    name: Enforce all checks
    needs: [validate-version, unit-test, integration-test, vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && github.ref_name != github.event.repository.default_branch && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Enforce all checks
        uses: poseidon/wait-for-status-checks@main
        with:
          token: ${{ github.token }}
          ignore_pattern: ".*Enforce all checks"

  notify-failure:
    name: Notify failure
    needs: [build, unit-test, integration-test, vulnerability-analysis, publish, enforce-all-checks]
    if: ${{ always() && failure() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: phorus-group/slack-pipeline-notify-action@main
        with:
          slack-token: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack-failure-channel }}
          status: failure

  notify-recovery:
    name: Notify recovery
    needs: [build, unit-test, integration-test, vulnerability-analysis, publish, enforce-all-checks]
    if: ${{ always() && !failure() && !cancelled() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: phorus-group/slack-pipeline-notify-action@main
        with:
          slack-token: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack-failure-channel }}
          status: success
