name: Reusable workflow to clean up old Docker packages from GHCR

on:
  workflow_call:
    inputs:
      package-name:
        description: "Package name in GHCR (defaults to repository name)"
        type: string
        required: false
        default: ""
      keep-n-latest:
        description: "Number of most recent images to keep per active branch"
        type: number
        required: false
        default: 5
      dry-run:
        description: "Log what would be deleted without actually deleting"
        type: boolean
        required: false
        default: false

jobs:
  cleanup:
    name: Clean up old Docker packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Clean up GHCR packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          PACKAGE_NAME: ${{ inputs.package-name || github.event.repository.name }}
          KEEP_N: ${{ inputs.keep-n-latest }}
          DRY_RUN: ${{ inputs.dry-run }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          deleted_count=0
          kept_count=0
          orphan_count=0
          branch_summary=""
          errors=""

          echo "## Docker Package Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`${PACKAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Keep per branch:** ${KEEP_N}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fetch all package versions (paginated)
          echo "Fetching package versions..."
          versions=$(gh api --paginate "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions" 2>/dev/null || echo "[]")

          total=$(echo "$versions" | jq 'length')
          if [[ "$total" == "0" ]]; then
            echo "No package versions found for ${PACKAGE_NAME}."
            echo "No package versions found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "Found ${total} package version(s)."

          # Fetch all branches
          echo "Fetching branches..."
          branches=$(gh api --paginate "repos/${REPO}/branches" --jq '.[].name' 2>/dev/null || echo "")
          branch_list=$(echo "$branches" | tr '\n' '|')

          # Group versions by branch using their SHA tags
          # Tags are: short SHA (always), "latest" (main only)
          # We resolve each SHA to its branch(es)

          # Build a map: version_id -> tags, created_at
          version_data=$(echo "$versions" | jq -r '.[] | "\(.id)\t\(.metadata.container.tags | join(","))\t\(.created_at)"')

          # Build maps: version_id -> digest, version_id -> created_at.
          # We need the digest later to fetch the manifest of each kept
          # version (so we can collect any platform-child manifest digests it
          # references and protect them from orphan deletion). We need
          # created_at for an optimisation that skips manifest fetches for
          # kept versions older than the oldest orphan candidate, since
          # multi-arch pushes always create the index after its children, so
          # an older kept index cannot reference a newer untagged version.
          declare -A version_id_to_digest
          declare -A version_id_to_created_at
          while IFS=$'\t' read -r dvid digest cat; do
            if [[ -n "$dvid" ]]; then
              version_id_to_digest["$dvid"]="$digest"
              version_id_to_created_at["$dvid"]="$cat"
            fi
          done <<< "$(echo "$versions" | jq -r '.[] | "\(.id)\t\(.name)\t\(.created_at)"')"

          declare -A branch_versions  # branch -> list of "created_at:version_id"
          declare -a orphan_versions   # versions whose SHA matches no existing branch
          declare -a kept_version_ids  # versions we end up keeping (latest-only or top-N per branch)

          while IFS=$'\t' read -r vid tags created_at; do
            [[ -z "$vid" ]] && continue

            # Extract SHA tag (7-char hex, not "latest")
            sha=""
            for tag in $(echo "$tags" | tr ',' ' '); do
              if [[ "$tag" =~ ^[0-9a-f]{7,}$ && "$tag" != "latest" ]]; then
                sha="$tag"
                break
              fi
            done

            if [[ -z "$sha" ]]; then
              # No SHA tag (e.g., untagged or only "latest")
              # If it has "latest" tag, keep it (it's the current main image)
              if echo "$tags" | grep -qw "latest"; then
                kept_count=$((kept_count + 1))
                kept_version_ids+=("${vid}")
                continue
              fi
              # Untagged image. May be either a true orphan, or a child
              # manifest of a multi-arch index we are keeping. Defer the
              # decision until we have computed the protected child digests.
              orphan_versions+=("${vid}")
              continue
            fi

            # Resolve SHA to branch(es)
            commit_branches=$(gh api "repos/${REPO}/commits/${sha}/branches-where-head" --jq '.[].name' 2>/dev/null || echo "")

            if [[ -z "$commit_branches" ]]; then
              # SHA doesn't match HEAD of any branch, check if commit exists at all
              # and find branches that contain it
              commit_branches=$(gh api "repos/${REPO}/commits/${sha}" --jq '.sha' 2>/dev/null || echo "")
              if [[ -z "$commit_branches" ]]; then
                # Commit doesn't exist anymore (force-pushed away).
                # Treat as orphan candidate. Final orphan count is recomputed
                # after the protection-pass filters out versions referenced
                # by kept indexes.
                orphan_versions+=("${vid}")
                continue
              fi

              # Commit exists but isn't HEAD of any branch
              # Check if any branch contains this commit
              found_branch=""
              while IFS= read -r branch; do
                [[ -z "$branch" ]] && continue
                if gh api "repos/${REPO}/compare/${branch}...${sha}" --jq '.status' 2>/dev/null | grep -q "behind\|identical"; then
                  found_branch="$branch"
                  break
                fi
              done <<< "$branches"

              if [[ -z "$found_branch" ]]; then
                orphan_versions+=("${vid}")
                continue
              fi
              commit_branches="$found_branch"
            fi

            # Add to branch map (use first matching branch)
            branch=$(echo "$commit_branches" | head -1)
            branch_versions["$branch"]+="${created_at}:${vid} "

          done <<< "$version_data"

          # Process each branch: sort by date, keep N most recent, delete the rest
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Per-branch retention" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | Total | Kept | Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for branch in "${!branch_versions[@]}"; do
            # Check if branch still exists
            branch_exists=false
            if echo "$branches" | grep -qx "$branch"; then
              branch_exists=true
            fi

            # Sort versions by date (newest first)
            sorted=$(echo "${branch_versions[$branch]}" | tr ' ' '\n' | sort -r | grep -v '^$')
            branch_total=$(echo "$sorted" | wc -l)

            if [[ "$branch_exists" == "true" ]]; then
              # Keep N most recent
              to_keep=$(echo "$sorted" | head -n "$KEEP_N")
              to_delete=$(echo "$sorted" | tail -n +"$((KEEP_N + 1))")
              branch_kept=$(echo "$to_keep" | grep -c . || true)
              branch_deleted=0

              while IFS= read -r entry; do
                [[ -z "$entry" ]] && continue
                vid="${entry#*:}"
                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "[DRY RUN] Would delete version ${vid} from branch ${branch}"
                else
                  if gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${vid}" 2>/dev/null; then
                    echo "Deleted version ${vid} from branch ${branch}"
                  else
                    errors+="Failed to delete version ${vid}\n"
                  fi
                fi
                deleted_count=$((deleted_count + 1))
                branch_deleted=$((branch_deleted + 1))
              done <<< "$to_delete"

              # Track each kept version's id so the protection step below
              # can fetch its manifest and protect any platform-child
              # manifests it references from being treated as orphans.
              while IFS= read -r entry; do
                [[ -z "$entry" ]] && continue
                kvid="${entry#*:}"
                kept_version_ids+=("$kvid")
              done <<< "$to_keep"

              kept_count=$((kept_count + branch_kept))
              echo "| \`${branch}\` | ${branch_total} | ${branch_kept} | ${branch_deleted} |" >> $GITHUB_STEP_SUMMARY
            else
              # Branch deleted, remove all versions
              while IFS= read -r entry; do
                [[ -z "$entry" ]] && continue
                vid="${entry#*:}"
                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "[DRY RUN] Would delete version ${vid} (branch ${branch} no longer exists)"
                else
                  if gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${vid}" 2>/dev/null; then
                    echo "Deleted version ${vid} (branch ${branch} no longer exists)"
                  else
                    errors+="Failed to delete version ${vid}\n"
                  fi
                fi
                deleted_count=$((deleted_count + 1))
              done <<< "$sorted"

              echo "| ~~\`${branch}\`~~ (deleted) | ${branch_total} | 0 | ${branch_total} |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # ---------------------------------------------------------------
          # Protect children of kept multi-arch indexes.
          #
          # GHCR stores a multi-arch image as several rows in the package
          # versions API. The OCI image index manifest (the wrapper) is the
          # one that carries the user-facing tag like a short SHA or
          # "latest". Each platform-specific child manifest (e.g. linux
          # amd64) and the build-attestation manifest are stored as
          # separate, *untagged* rows. The categorisation loop above
          # therefore puts those children into orphan_versions purely
          # because they have no tag, even though they are alive children
          # of an index we are keeping.
          #
          # Without protection, deleting them leaves the still-tagged
          # index pointing at a missing child digest, which means anything
          # trying to pull the tagged image gets a 404 on the manifest hop.
          #
          # The protection step fetches each kept version's manifest from
          # ghcr.io directly, parses the OCI index body, and collects the
          # digest of every child it references into protected_digests.
          # The orphan deletion below then drops any version whose own
          # digest is in protected_digests.
          # ---------------------------------------------------------------

          declare -A protected_digests
          declare -A fetched_digests   # memoise: avoid re-fetching the same digest
          fetch_failed=false

          if [[ ${#orphan_versions[@]} -eq 0 ]]; then
            # Nothing to protect, skip the step entirely so the steady-state
            # cost (when there is no cleanup to do) is zero ghcr.io requests.
            echo "No orphan candidates after categorisation, skipping child-protection step."
          elif [[ ${#kept_version_ids[@]} -eq 0 ]]; then
            # No kept versions to walk, every orphan candidate is a real orphan.
            echo "No kept versions found, all orphan candidates are real orphans."
          else
            echo "Computing protected child digests for ${#kept_version_ids[@]} kept version(s)..."

            # Date cutoff. Multi-arch pushes always create the platform
            # child manifests *before* the index that references them, so a
            # child's created_at is always <= its index's created_at. The
            # oldest possible index that could reference a given orphan
            # candidate is therefore the one created at-or-after the orphan's
            # own created_at (minus a small clock-skew buffer). Anything
            # older than that cannot reference this batch of orphans.
            cutoff_epoch=0
            oldest_orphan_ts=""
            for ovid in "${orphan_versions[@]}"; do
              ts="${version_id_to_created_at[$ovid]:-}"
              [[ -z "$ts" ]] && continue
              if [[ -z "$oldest_orphan_ts" || "$ts" < "$oldest_orphan_ts" ]]; then
                oldest_orphan_ts="$ts"
              fi
            done
            if [[ -n "$oldest_orphan_ts" ]]; then
              cutoff_epoch=$(($(date -u -d "$oldest_orphan_ts" +%s) - 60))
            fi

            # Get a registry pull token for ghcr.io. The workflow token
            # already has packages: write permission, so a pull-scoped
            # registry token is granted by exchanging it on the
            # ghcr.io/token endpoint.
            REGISTRY_TOKEN=$(curl -fsS -u "${GH_ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${PACKAGE_NAME}:pull" \
              2>/dev/null | jq -r .token 2>/dev/null || echo "")

            if [[ -z "$REGISTRY_TOKEN" || "$REGISTRY_TOKEN" == "null" ]]; then
              # If we cannot authenticate, we cannot enumerate protected
              # children. Refuse to delete any orphan candidate so we do
              # not corrupt tagged images.
              echo "WARNING: Could not obtain ghcr.io registry pull token. Skipping orphan deletion to avoid corrupting tagged images."
              fetch_failed=true
            else
              for kvid in "${kept_version_ids[@]}"; do
                kept_digest="${version_id_to_digest[$kvid]:-}"
                [[ -z "$kept_digest" || "$kept_digest" == "null" ]] && continue

                # Memoise per digest. Two different version rows can in rare
                # cases share the same digest (retag without rebuild).
                # Fetching the same manifest twice is just waste.
                [[ -n "${fetched_digests[$kept_digest]:-}" ]] && continue
                fetched_digests["$kept_digest"]=1

                # Skip if older than the oldest orphan minus the buffer.
                # Saves the network round-trip for older kept indexes that
                # cannot possibly reference this run's orphan candidates.
                kept_ts="${version_id_to_created_at[$kvid]:-}"
                if [[ -n "$kept_ts" && $cutoff_epoch -gt 0 ]]; then
                  kept_epoch=$(date -u -d "$kept_ts" +%s 2>/dev/null || echo 0)
                  if [[ $kept_epoch -lt $cutoff_epoch ]]; then
                    continue
                  fi
                fi

                # Fetch the manifest body. If the kept version is an OCI
                # image index, its body has a `manifests` array listing each
                # child by digest. If it is a single-arch image manifest
                # there is no `manifests` array and jq returns nothing.
                manifest=$(curl -fsS \
                  -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                  -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                  "https://ghcr.io/v2/${OWNER}/${PACKAGE_NAME}/manifests/${kept_digest}" \
                  2>/dev/null) || { fetch_failed=true; break; }

                while IFS= read -r child; do
                  [[ -n "$child" && "$child" != "null" ]] && protected_digests["$child"]=1
                done <<< "$(echo "$manifest" | jq -r '.manifests[]?.digest // empty' 2>/dev/null || echo "")"
              done
            fi

            if [[ "$fetch_failed" == "true" ]]; then
              # Conservative fallback: if any manifest failed to fetch, we
              # do not have a complete picture of protected children, so
              # we cannot safely classify any candidate as a real orphan.
              echo "WARNING: Failed to fetch one or more kept manifests. Skipping orphan deletion to avoid corrupting tagged images."
              orphan_versions=()
            else
              # Filter orphan_versions: drop entries whose own digest is
              # referenced by a kept index, those are platform children we
              # must not delete.
              filtered_orphans=()
              for vid in "${orphan_versions[@]}"; do
                vd="${version_id_to_digest[$vid]:-}"
                if [[ -n "$vd" && -n "${protected_digests[$vd]:-}" ]]; then
                  echo "Protecting version ${vid} (${vd}), referenced as child of a kept index"
                else
                  filtered_orphans+=("$vid")
                fi
              done
              orphan_versions=("${filtered_orphans[@]}")
            fi
          fi

          # Re-set orphan_count from the (possibly filtered) array so the
          # summary table below shows the actual number we are deleting.
          orphan_count=${#orphan_versions[@]}

          # Delete orphan versions (no branch association)
          if [[ ${#orphan_versions[@]} -gt 0 ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Orphaned images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Found **${orphan_count}** orphaned image(s) (commit no longer exists or untagged)." >> $GITHUB_STEP_SUMMARY

            for vid in "${orphan_versions[@]}"; do
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "[DRY RUN] Would delete orphaned version ${vid}"
              else
                if gh api --method DELETE "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${vid}" 2>/dev/null; then
                  echo "Deleted orphaned version ${vid}"
                else
                  errors+="Failed to delete orphaned version ${vid}\n"
                fi
              fi
              deleted_count=$((deleted_count + 1))
            done
          fi

          # Summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Total versions found | ${total} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kept | ${kept_count} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deleted | ${deleted_count} |" >> $GITHUB_STEP_SUMMARY
          echo "| Orphaned | ${orphan_count} |" >> $GITHUB_STEP_SUMMARY

          if [[ -n "$errors" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Errors" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo -e "$errors" >> $GITHUB_STEP_SUMMARY
          fi

          echo ""
          echo "Cleanup complete: ${deleted_count} deleted, ${kept_count} kept, ${orphan_count} orphaned"
