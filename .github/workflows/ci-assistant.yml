name: CI Assistant

on:
  workflow_call:
    inputs:
      java-version:
        description: "Java version to set up (leave empty to skip)"
        type: string
        required: false
        default: ""
      java-distribution:
        description: "Java distribution to use"
        type: string
        required: false
        default: "temurin"
      node-version:
        description: "Node version to set up (leave empty to skip)"
        type: string
        required: false
        default: ""
      working-directory:
        description: "Directory where Claude Code runs"
        type: string
        required: false
        default: "."
      max-turns:
        description: "Max Claude conversation turns per attempt. Use -1 for unlimited."
        type: number
        required: false
        default: 50
      max-retries:
        description: "Max retry attempts (each gets fresh max-turns budget)"
        type: number
        required: false
        default: 3
      max-retry-commands:
        description: "Max /ci-assistant retry commands per PR. Use -1 for unlimited."
        type: number
        required: false
        default: 2
      max-alternative-commands:
        description: "Max /ci-assistant alternative commands per PR. Use -1 for unlimited."
        type: number
        required: false
        default: 3
      max-suggest-commands:
        description: "Max /ci-assistant suggest commands per PR. Use -1 for unlimited."
        type: number
        required: false
        default: 3
      max-explain-commands:
        description: "Max /ci-assistant explain commands per PR. Use -1 for unlimited."
        type: number
        required: false
        default: 3
      max-total-commands:
        description: "Max total non-admin commands per PR. Use -1 for unlimited."
        type: number
        required: false
        default: 20
      model:
        description: "Claude model to use (e.g. 'claude-sonnet-4-6', 'claude-opus-4-6', 'claude-haiku-4-5-20251001')"
        type: string
        required: false
        default: "claude-sonnet-4-6"
      skip-permissions:
        description: "Pass --dangerously-skip-permissions to Claude Code. Safe in CI since the runner is ephemeral. Set to false to require permission checks."
        type: boolean
        required: false
        default: true
      allowed-tools:
        description: "Comma-separated list of tools Claude Code can use (e.g. 'Bash,Edit,Read,Write,WebSearch'). Empty means all tools available."
        type: string
        required: false
        default: ""
      disallowed-tools:
        description: "Comma-separated list of tools Claude Code cannot use (e.g. 'WebSearch,WebFetch'). Takes precedence over allowed-tools."
        type: string
        required: false
        default: ""
      append-system-prompt:
        description: "Additional system prompt appended to Claude Code's default system prompt. Use for project-specific instructions not covered by CLAUDE.md."
        type: string
        required: false
        default: ""
      admin-users:
        description: "Comma-separated GitHub usernames of admin users (e.g. user1,user2)"
        type: string
        required: false
        default: ""
      banned-users:
        description: "Comma-separated GitHub usernames permanently banned from using CI Assistant"
        type: string
        required: false
        default: ""
      slack-failure-channel:
        description: "Slack channel ID for fix notifications (optional, everything works without Slack)"
        type: string
        required: false
        default: ""
      slack-thread-ts:
        description: "Slack thread timestamp to post as a reply (optional)"
        type: string
        required: false
        default: ""
      auto-fix-prompt:
        description: "Prompt template for automatic fix attempts. Placeholders: {{FAILURE_LOGS}}, {{REPO}}, {{BRANCH}}, {{SHA}}, {{CONVERSATION_HISTORY}}, {{REPRODUCTION_OUTPUT}}"
        type: string
        required: false
        default: ""
      retry-prompt:
        description: "Prompt template for retry attempts. Placeholders: {{FAILURE_LOGS}}, {{PREVIOUS_ATTEMPTS}}, {{REPRODUCTION_OUTPUT}}, {{REPO}}, {{BRANCH}}, {{SHA}}, {{CONVERSATION_HISTORY}}"
        type: string
        required: false
        default: ""
      alternative-prompt:
        description: "Prompt template for alternative suggestions. Placeholders: {{FAILURE_LOGS}}, {{PREVIOUS_SUGGESTIONS}}, {{REPO}}, {{BRANCH}}, {{SHA}}, {{CONVERSATION_HISTORY}}"
        type: string
        required: false
        default: ""
      suggest-prompt:
        description: "Prompt template for suggest commands. Placeholders: {{USER_CONTEXT}}, {{FAILURE_LOGS_IF_AVAILABLE}}, {{CONVERSATION_HISTORY}}, {{REPO}}, {{BRANCH}}, {{SHA}}"
        type: string
        required: false
        default: ""
      explain-prompt:
        description: "Prompt template for explain commands. Placeholders: {{USER_PROMPT}}, {{FAILURE_LOGS_IF_AVAILABLE}}, {{LATEST_FIX_DIFF}}, {{CONVERSATION_HISTORY}}, {{REPO}}, {{BRANCH}}"
        type: string
        required: false
        default: ""
      confidence-prompt:
        description: "Prompt appended to fix prompts for confidence analysis. Placeholders: {{FAILURE_LOGS}}, {{REPRODUCTION_OUTPUT}}, {{FIX_DIFF}}, {{POST_FIX_TEST_OUTPUT}}, {{PREVIOUS_SUGGESTIONS}}, {{USER_CONTEXT}}"
        type: string
        required: false
        default: ""
    secrets:
      claude-code-oauth-token:
        required: false
      anthropic-api-key:
        required: false
      slack-bot-token:
        required: false
      github-app-id:
        description: "GitHub App ID for custom bot identity (optional, falls back to github-actions[bot])"
        required: false
      github-app-private-key:
        description: "GitHub App private key for custom bot identity (optional)"
        required: false

jobs:
  ci-assistant:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/ci-assistant') && github.event.issue.pull_request && github.event.comment.user.type != 'Bot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-assistant-${{ github.event.issue.number || github.event.workflow_run.head_branch || 'manual' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - name: Generate GitHub App token
        if: secrets.github-app-id != ''
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }}

      - name: Determine mode and context
        id: context
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "mode=auto-fix" >> $GITHUB_OUTPUT
            echo "checkout-ref=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "failed-run-id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "failed-branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            echo "failed-sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls --jq '.[0].number // empty' 2>/dev/null || echo "")
            echo "failed-pr-number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "mode=command" >> $GITHUB_OUTPUT
            echo "comment-pr-number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            PR_SHA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq '.head.sha')
            echo "checkout-ref=${PR_SHA}" >> $GITHUB_OUTPUT
          else
            echo "mode=manual" >> $GITHUB_OUTPUT
            echo "failed-run-id=${{ github.event.inputs.run-id }}" >> $GITHUB_OUTPUT
            echo "checkout-ref=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.checkout-ref || '' }}

      - uses: actions/setup-java@v4
        if: inputs.java-version != ''
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - uses: actions/setup-node@v4
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run CI Assistant
        uses: phorus-group/ci-assistant-action@v1
        with:
          mode: ${{ steps.context.outputs.mode }}
          working-directory: ${{ inputs.working-directory }}
          failed-run-id: ${{ steps.context.outputs.failed-run-id }}
          failed-branch: ${{ steps.context.outputs.failed-branch }}
          failed-sha: ${{ steps.context.outputs.failed-sha }}
          failed-pr-number: ${{ steps.context.outputs.failed-pr-number }}
          comment-pr-number: ${{ steps.context.outputs.comment-pr-number }}
          max-turns: ${{ inputs.max-turns }}
          max-retries: ${{ inputs.max-retries }}
          max-retry-commands: ${{ inputs.max-retry-commands }}
          max-alternative-commands: ${{ inputs.max-alternative-commands }}
          max-suggest-commands: ${{ inputs.max-suggest-commands }}
          max-explain-commands: ${{ inputs.max-explain-commands }}
          max-total-commands: ${{ inputs.max-total-commands }}
          model: ${{ inputs.model }}
          skip-permissions: ${{ inputs.skip-permissions }}
          allowed-tools: ${{ inputs.allowed-tools }}
          disallowed-tools: ${{ inputs.disallowed-tools }}
          append-system-prompt: ${{ inputs.append-system-prompt }}
          admin-users: ${{ inputs.admin-users }}
          banned-users: ${{ inputs.banned-users }}
          slack-failure-channel: ${{ inputs.slack-failure-channel }}
          slack-thread-ts: ${{ inputs.slack-thread-ts }}
          slack-bot-token: ${{ secrets.slack-bot-token }}
          auto-fix-prompt: ${{ inputs.auto-fix-prompt }}
          retry-prompt: ${{ inputs.retry-prompt }}
          alternative-prompt: ${{ inputs.alternative-prompt }}
          suggest-prompt: ${{ inputs.suggest-prompt }}
          explain-prompt: ${{ inputs.explain-prompt }}
          confidence-prompt: ${{ inputs.confidence-prompt }}
          github-token: ${{ steps.app-token.outputs.token }}
          claude-code-oauth-token: ${{ secrets.claude-code-oauth-token }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          comment-body: ${{ github.event.comment.body }}

  auto-cleanup:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        if: secrets.github-app-id != ''
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.github-app-id }}
          private-key: ${{ secrets.github-app-private-key }}

      - uses: phorus-group/ci-assistant-action@v1
        with:
          mode: cleanup
          failed-branch: ${{ github.event.workflow_run.head_branch }}
          github-token: ${{ steps.app-token.outputs.token }}
