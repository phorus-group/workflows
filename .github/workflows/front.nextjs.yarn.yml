name: Reusable workflow to build and publish a NextJS docker image to GHCR

on:
  workflow_call:
    inputs:
      lfs:
        description: "Enable git LFS"
        type: boolean
        required: false
        default: false
      node-version:
        description: "Node version to use"
        type: string
        required: false
        default: "22.2.0"
      registry-scope:
        description: "Scope to use with the private registry"
        type: string
        required: false
      private-registry:
        description: "Private NPM registry to use"
        type: string
        required: false
        default: "npm.pkg.github.com"
      auth-key:
        description: "Auth key to use inside ~/.npmrc"
        type: string
        required: false
        default: "authToken"
      disable-unit-test:
        description: "Disable unit testing job"
        type: string
        required: false
        default: "false"
      disable-integration-test:
        description: "Disable integration testing job"
        type: string
        required: false
        default: "false"
      disable-vulnerability-analysis:
        description: "Disable vulnerability analysis job"
        type: boolean
        required: false
        default: false
      disable-docker:
        description: "Disable the Docker build and push job"
        type: boolean
        required: false
        default: false
      gh-advanced-security:
        description: "Enable if you have GitHub Advanced Security"
        type: boolean
        required: false
        default: false
      code-quality-info-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 10
      code-quality-minor-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 5
      code-quality-major-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 1
      code-quality-critical-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      code-quality-blocker-threshold:
        description: "The number of findings of this severity allowed before the job returns a failure"
        type: number
        required: false
        default: 0
      slack-failure-channel:
        description: "Slack channel ID for failure notifications. If empty, no notification is sent"
        type: string
        required: false
        default: ""
    secrets:
      auth-value:
        description: "Auth value to use inside ~/.npmrc. Defaults to secrets.PACKAGES_READ" # Remember that the github.token only has access to the current repo packages
        required: false
      codecov-token:
        description: "Codecov token for private repos. Public repos can leave this empty."
        required: false
      slack-bot-token:
        description: "Slack Bot User OAuth Token (xoxb-...)"
        required: false
    outputs:
      image:
        description: "The Docker image reference (registry/repo:tag)"
        value: ${{ jobs.docker.outputs.image }}
      image-tag:
        description: "The Docker image tag only"
        value: ${{ jobs.docker.outputs.image-tag }}

jobs:
  notify-running:
    name: Mark previous failure as running
    if: ${{ inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update previous failure message to running
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SEARCH_TEXT=":x: *Pipeline failed* in \`${REPO}\` on \`${REF}\`"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=20")

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then exit 0; fi

          FAILURE_MSG=$(echo "$HISTORY" | jq --arg search "$SEARCH_TEXT" \
            '[.messages[] | select(.blocks != null) | select(.blocks[].text.text? // "" | contains($search))][0] // empty')

          if [[ -z "$FAILURE_MSG" || "$FAILURE_MSG" == "null" ]]; then exit 0; fi

          FAILURE_TS=$(echo "$FAILURE_MSG" | jq -r '.ts')
          FAILED_URL=$(echo "$FAILURE_MSG" | jq -r '[.blocks[] | select(.type == "actions") | .elements[] | select(.text.text == "View Failed Run") | .url][0] // empty')

          UPDATED_BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg failed_url "$FAILED_URL" --arg new_url "$RUN_URL" '[
            {type: "section", text: {type: "mrkdwn", text: (":x: *Pipeline failed* in `" + $repo + "` on `" + $ref + "`")}},
            {type: "actions", elements: [
              {type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $failed_url, style: "danger"},
              {type: "button", text: {type: "plain_text", text: "View New Run"}, url: $new_url}
            ]},
            {type: "context", elements: [{type: "mrkdwn", text: ":hourglass_flowing_sand: Pipeline running again..."}]}
          ]')

          curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg channel "$CHANNEL" --arg ts "$FAILURE_TS" --argjson blocks "$UPDATED_BLOCKS" \
              '{channel: $channel, ts: $ts, blocks: $blocks}')" > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.lfs }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure npm registry globally in ~/.npmrc
        if: ${{ inputs.registry-scope != '' }}
        run: |
          echo "${{ inputs.registry-scope }}:registry=https://${{ inputs.private-registry }}" >> ~/.npmrc
          echo "//${{ inputs.private-registry }}/:_${{ inputs.auth-key }}=${{ secrets.auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Run build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          include-hidden-files: true
          retention-days: 2
          path: |
            .next/standalone
            .next/static
            ./public

  unit-test:
    name: Unit tests
    needs: [build]
    if: ${{ inputs.disable-unit-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure npm registry globally in ~/.npmrc
        if: ${{ inputs.registry-scope != '' }}
        run: |
          echo "${{ inputs.registry-scope }}:registry=https://${{ inputs.private-registry }}" >> ~/.npmrc
          echo "//${{ inputs.private-registry }}/:_${{ inputs.auth-key }}=${{ secrets.auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Run unit-tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:unit
          test-label: Unit

      - name: Run storybook tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:storybook:ci
          test-label: Storybook
          coverage-summary-location: ./test/.storybook-coverage/coverage-summary.json
          coverage-json-location: ./test/.storybook-coverage/coverage-final.json
          coverage-report-location: ./test/.storybook-coverage/cobertura-coverage.xml
          junit-report-location: ./test/.storybook-coverage/junit.xml

      - name: Merge unit + storybook coverage
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          npm install -g nyc
          mkdir -p .nyc_merge_input
          cp test/.coverage/coverage-final.json .nyc_merge_input/unit.json 2>/dev/null || true
          cp test/.storybook-coverage/coverage-final.json .nyc_merge_input/storybook.json 2>/dev/null || true
          mkdir -p .nyc_output
          nyc merge .nyc_merge_input .nyc_output/coverage.json
          nyc report --reporter=json --report-dir=test/.merged-unit-coverage

      - name: Upload merged unit coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          retention-days: 2
          path: test/.merged-unit-coverage/coverage-final.json

      - name: Upload to Codecov (when integration tests are disabled)
        if: ${{ !cancelled() && inputs.disable-integration-test == 'true' && secrets.codecov-token != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: test/.merged-unit-coverage/coverage-final.json
          token: ${{ secrets.codecov-token }}
          fail_ci_if_error: false

  integration-test:
    name: Integration tests

    needs: [build]
    if: ${{ inputs.disable-integration-test != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure npm registry globally in ~/.npmrc
        if: ${{ inputs.registry-scope != '' }}
        run: |
          echo "${{ inputs.registry-scope }}:registry=https://${{ inputs.private-registry }}" >> ~/.npmrc
          echo "//${{ inputs.private-registry }}/:_${{ inputs.auth-key }}=${{ secrets.auth-value || secrets.PACKAGES_READ }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        shell: bash
        run: npx playwright install --with-deps

      - name: Run integration-tests
        uses: phorus-group/yarn-test-action@main
        with:
          command: test:integration
          test-label: Integration
          artifact-suffix: integration
          codecov-token: ${{ inputs.disable-unit-test == 'true' && secrets.codecov-token || '' }}

  merge-test-reports:
    name: Merge test reports
    if: ${{ !failure() && !cancelled() && inputs.disable-unit-test != 'true' && inputs.disable-integration-test != 'true' }}
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Merge test reports
        uses: phorus-group/yarn-merge-reports-action@main
        with:
          test-artifact-1: coverage-unit
          test-artifact-2: coverage-integration
          codecov-token: ${{ secrets.codecov-token }}

  # This is giving us issues with GHA runners, so we are disabling it for now
  # code-quality:
  #   name: Code quality check
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Check code quality
  #       uses: phorus-group/code-quality-action@main
  #       with:
  #         info-threshold: ${{ inputs.code-quality-info-threshold }}
  #         minor-threshold: ${{ inputs.code-quality-minor-threshold }}
  #         major-threshold: ${{ inputs.code-quality-major-threshold }}
  #         critical-threshold: ${{ inputs.code-quality-critical-threshold }}
  #         blocker-threshold: ${{ inputs.code-quality-blocker-threshold }}

  vulnerability-analysis:
    name: Vulnerability analysis
    needs: [build]
    if: ${{ !inputs.disable-vulnerability-analysis }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Analyse project for vulnerabilities
        uses: phorus-group/vulnerability-analysis-action@main
        with:
          skip-dirs: node_modules,.git
          upload-sarif: ${{ inputs.gh-advanced-security }}

  docker:
    name: Docker build and push
    needs: [unit-test,integration-test,vulnerability-analysis]
    if: ${{ !failure() && !cancelled() && !(inputs.disable-docker && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      image-tag: ${{ steps.docker-push.outputs.image-tag }}
    steps:
      - name: Checkout code
        if: ${{ !inputs.disable-docker }}
        uses: actions/checkout@v4

      - name: Download build artifacts
        if: ${{ !inputs.disable-docker }}
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build

      - name: Build and push Docker image
        id: docker-push
        if: ${{ !inputs.disable-docker }}
        uses: phorus-group/docker-action@main
        with:
          dockerfile-path: "dockerfiles/Dockerfile.nextjs"
          push: true
          vulnerability-analysis: false

  enforce-all-checks:
    name: Enforce all checks
    needs: [docker]
    if: ${{ !failure() && !cancelled() && github.ref_name != github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Enforce all checks
        uses: poseidon/wait-for-status-checks@main
        with:
          token: ${{ github.token }}
          ignore_pattern: ".*Enforce all checks"

  notify-failure:
    name: Notify failure
    needs: [build, unit-test, integration-test, vulnerability-analysis, docker, enforce-all-checks]
    if: ${{ always() && failure() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack failure notification
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"

          BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg url "$RUN_URL" '[
            {type: "section", text: {type: "mrkdwn", text: (":x: *Pipeline failed* in `" + $repo + "` on `" + $ref + "`")}},
            {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $url, style: "danger"}]},
            {type: "context", elements: [{type: "mrkdwn", text: ":red_circle: Failed"}]}
          ]')

          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg channel "$CHANNEL" --argjson blocks "$BLOCKS" \
              '{channel: $channel, blocks: $blocks, unfurl_links: false, unfurl_media: false}')" > /dev/null

  notify-recovery:
    name: Notify recovery
    needs: [build, unit-test, integration-test, vulnerability-analysis, docker, enforce-all-checks]
    if: ${{ always() && !failure() && !cancelled() && inputs.slack-failure-channel != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update previous failure message if exists
        env:
          SLACK_TOKEN: ${{ secrets.slack-bot-token || secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack-failure-channel }}
        run: |
          if [[ -z "$SLACK_TOKEN" ]]; then exit 0; fi

          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SEARCH_TEXT=":x: *Pipeline failed* in \`${REPO}\` on \`${REF}\`"

          HISTORY=$(curl -s -H "Authorization: Bearer $SLACK_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL}&limit=20")

          if [[ "$(echo "$HISTORY" | jq -r '.ok')" != "true" ]]; then exit 0; fi

          FAILURE_MSG=$(echo "$HISTORY" | jq --arg search "$SEARCH_TEXT" \
            '[.messages[] | select(.blocks != null) | select(.blocks[].text.text? // "" | contains($search))][0] // empty')

          if [[ -z "$FAILURE_MSG" || "$FAILURE_MSG" == "null" ]]; then exit 0; fi

          FAILURE_TS=$(echo "$FAILURE_MSG" | jq -r '.ts')
          FAILED_URL=$(echo "$FAILURE_MSG" | jq -r '[.blocks[] | select(.type == "actions") | .elements[] | select(.text.text == "View Failed Run") | .url][0] // empty')

          UPDATED_BLOCKS=$(jq -n --arg repo "$REPO" --arg ref "$REF" --arg failed_url "$FAILED_URL" --arg fix_url "$RUN_URL" '[
            {type: "section", text: {type: "mrkdwn", text: (":white_check_mark: *Pipeline recovered* in `" + $repo + "` on `" + $ref + "`")}},
            {type: "actions", elements: [
              {type: "button", text: {type: "plain_text", text: "View Failed Run"}, url: $failed_url},
              {type: "button", text: {type: "plain_text", text: "View Recovery Run"}, url: $fix_url, style: "primary"}
            ]},
            {type: "context", elements: [{type: "mrkdwn", text: ":large_green_circle: Recovered"}]}
          ]')

          curl -s -X POST "https://slack.com/api/chat.update" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg channel "$CHANNEL" --arg ts "$FAILURE_TS" --argjson blocks "$UPDATED_BLOCKS" \
              '{channel: $channel, ts: $ts, blocks: $blocks}')" > /dev/null
